<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="omahBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#0D0E12"/>
    </linearGradient>
    <linearGradient id="artCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222631"/>
      <stop offset="100%" stop-color="#181B23"/>
    </linearGradient>
    <filter id="previewShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="10" y="10" width="660" height="400" rx="20" fill="url(#omahBg)" stroke="#262A34" stroke-width="2"/>

  <!-- Browser Top bar -->
  <path d="M10 30 C10 19 19 10 30 10 L650 10 C661 10 670 19 670 30 L670 52 L10 52 Z" fill="#181B22"/>
  <circle cx="34" cy="31" r="5" fill="#EF4444"/>
  <circle cx="50" cy="31" r="5" fill="#F59E0B"/>
  <circle cx="66" cy="31" r="5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="100" y="21" width="320" height="22" rx="6" fill="#0F1116"/>
  <text x="135" y="36" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10.5" fill="#94A3B8">https://omahvector.id/catalog</text>
  <circle cx="120" cy="32" r="3" fill="#CCFF00"/>

  <!-- App Header inside web app -->
  <rect x="35" y="70" width="610" height="40" rx="10" fill="#1A1E26"/>
  <text x="55" y="95" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#CCFF00">OMAH VECTOR</text>
  <text x="175" y="94" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">Catalog</text>
  <text x="245" y="94" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8892B0">Price List</text>
  <text x="325" y="94" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8892B0">Order Tracking</text>
  <rect x="545" y="77" width="85" height="26" rx="13" fill="#CCFF00"/>
  <text x="562" y="94" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0E1013">Order Now</text>

  <!-- Left Showcase Hero Banner -->
  <g filter="url(#previewShadow)">
    <rect x="35" y="125" width="370" height="260" rx="16" fill="url(#artCardBg)" stroke="#2D3340" stroke-width="1.5"/>
    
    <!-- Hero Text -->
    <rect x="55" y="145" width="115" height="20" rx="10" fill="#2E3714"/>
    <text x="67" y="159" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#CCFF00">UMKM SOLUTION</text>
    <text x="55" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Custom Vector &amp;</text>
    <text x="55" y="220" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#CCFF00">Digital Illustration</text>
    <text x="55" y="248" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Pemesanan online instan dengan kalkulasi</text>
    <text x="55" y="266" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" fill="#94A3B8">harga otomatis, upload foto &amp; revisi.</text>

    <!-- Vector nodes visual representation -->
    <path d="M260 270 Q300 210 340 280 T380 230" stroke="#CCFF00" stroke-width="2.5" fill="none"/>
    <circle cx="260" cy="270" r="5" fill="#0E1013" stroke="#CCFF00" stroke-width="2"/>
    <circle cx="300" cy="235" r="5" fill="#0E1013" stroke="#CCFF00" stroke-width="2"/>
    <circle cx="340" cy="280" r="5" fill="#0E1013" stroke="#CCFF00" stroke-width="2"/>
    <circle cx="380" cy="230" r="5" fill="#0E1013" stroke="#CCFF00" stroke-width="2"/>

    <!-- Mini Action Button -->
    <rect x="55" y="295" width="140" height="38" rx="19" fill="#CCFF00"/>
    <text x="75" y="319" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0E1013">Pesan Sekarang →</text>
  </g>

  <!-- Right Order Customization Card -->
  <g filter="url(#previewShadow)">
    <rect x="420" y="125" width="225" height="260" rx="16" fill="#1B1E26" stroke="#2D3340" stroke-width="1.5"/>

    <text x="438" y="155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Live Order Estimator</text>
    
    <!-- Option 1 -->
    <rect x="438" y="172" width="189" height="42" rx="8" fill="#14161E" stroke="#CCFF00" stroke-width="1.5"/>
    <text x="450" y="191" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Realistic Vector Art</text>
    <text x="450" y="206" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#CCFF00">Full Head &amp; Shoulder • 300 DPI</text>

    <!-- Option 2 -->
    <rect x="438" y="222" width="189" height="42" rx="8" fill="#14161E" stroke="#252A36" stroke-width="1"/>
    <text x="450" y="241" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Line Art / Minimalist</text>
    <text x="450" y="255" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" fill="#64748B">Express 24h delivery option</text>

    <!-- Price Summary Box -->
    <rect x="438" y="278" width="189" height="52" rx="8" fill="#0F1116"/>
    <text x="450" y="297" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="500" fill="#8892B0">Total Price Estimate</text>
    <text x="450" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#CCFF00">Rp 75.000</text>

    <!-- Submit Button inside Card -->
    <rect x="438" y="340" width="189" height="32" rx="16" fill="#252A36"/>
    <text x="495" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Checkout WA →</text>
  </g>
</svg>
