<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 580" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="heroCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D23"/>
      <stop offset="100%" stop-color="#0E1013"/>
    </linearGradient>
    <linearGradient id="limeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#CCFF00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#CCFF00" stop-opacity="0"/>
    </radialGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Decorative Orbit & Circles -->
  <circle cx="270" cy="270" r="230" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.3"/>
  <circle cx="270" cy="270" r="185" stroke="#FFFFFF" stroke-width="1" opacity="0.1"/>
  <circle cx="270" cy="250" r="160" fill="url(#avatarGlow)"/>

  <!-- Geometric Dots Cluster -->
  <g opacity="0.4" fill="#CCFF00">
    <circle cx="450" cy="90" r="3"/>
    <circle cx="470" cy="90" r="3"/>
    <circle cx="490" cy="90" r="3"/>
    <circle cx="450" cy="110" r="3"/>
    <circle cx="470" cy="110" r="3"/>
    <circle cx="490" cy="110" r="3"/>
    <circle cx="450" cy="130" r="3"/>
    <circle cx="470" cy="130" r="3"/>
    <circle cx="490" cy="130" r="3"/>
  </g>

  <!-- Plus Crosshair Decor -->
  <g stroke="#CCFF00" stroke-width="2" opacity="0.6">
    <line x1="70" y1="95" x2="70" y2="115"/>
    <line x1="60" y1="105" x2="80" y2="105"/>
  </g>
  <g stroke="#8C94A0" stroke-width="1.5" opacity="0.4">
    <line x1="475" y1="465" x2="475" y2="485"/>
    <line x1="465" y1="475" x2="485" y2="475"/>
  </g>

  <!-- Central Avatar Container (Rounded Card Frame) -->
  <rect x="80" y="50" width="380" height="440" rx="36" fill="url(#heroCardBg)" stroke="#282C34" stroke-width="2"/>
  <rect x="80" y="50" width="380" height="440" rx="36" fill="url(#limeGlow)"/>

  <!-- Subtle grid lines inside card -->
  <line x1="80" y1="180" x2="460" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>
  <line x1="80" y1="320" x2="460" y2="320" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>
  <line x1="220" y1="50" x2="220" y2="490" stroke="#FFFFFF" stroke-width="1" opacity="0.04"/>

  <!-- Character Illustration (Kevin - Sleek Modern Dev Silhouette & Details) -->
  <g id="avatarFigure">
    <!-- Body/Hoodie -->
    <path d="M150 490 C150 395 195 365 270 365 C345 365 390 395 390 490 Z" fill="#242831"/>
    <!-- Collar & Accent -->
    <path d="M225 367 C245 395 295 395 315 367" stroke="#CCFF00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M270 388 L270 450" stroke="#CCFF00" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>

    <!-- Neck -->
    <rect x="248" y="305" width="44" height="65" rx="10" fill="#E0A985"/>

    <!-- Head / Face -->
    <ellipse cx="270" cy="245" rx="58" ry="70" fill="#F4BE9B"/>

    <!-- Modern Haircut -->
    <path d="M205 240 C205 165 250 150 305 155 C335 158 340 185 335 220 C325 210 310 205 290 205 C250 205 230 220 205 240 Z" fill="#181A20"/>

    <!-- Glasses Frame -->
    <rect x="228" y="230" width="34" height="24" rx="8" fill="#121316" stroke="#CCFF00" stroke-width="2.5"/>
    <rect x="278" y="230" width="34" height="24" rx="8" fill="#121316" stroke="#CCFF00" stroke-width="2.5"/>
    <line x1="262" y1="242" x2="278" y2="242" stroke="#CCFF00" stroke-width="2.5"/>
    <line x1="216" y1="240" x2="228" y2="242" stroke="#CCFF00" stroke-width="2"/>
    <line x1="312" y1="242" x2="324" y2="240" stroke="#CCFF00" stroke-width="2"/>

    <!-- Friendly Expression -->
    <path d="M255 282 Q270 294 285 282" stroke="#4A2E1B" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Headphones on neck -->
    <path d="M215 315 C215 360 325 360 325 315" stroke="#373D49" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="204" y="295" width="22" height="38" rx="7" fill="#CCFF00"/>
    <rect x="314" y="295" width="22" height="38" rx="7" fill="#CCFF00"/>
  </g>

  <!-- FLOATING BADGE 1: Top Left (Status Pill) -->
  <g filter="url(#badgeShadow)">
    <rect x="30" y="130" width="168" height="48" rx="24" fill="#121418" stroke="#333842" stroke-width="1.5"/>
    <!-- Glowing green dot -->
    <circle cx="56" cy="154" r="5" fill="#CCFF00"/>
    <circle cx="56" cy="154" r="9" stroke="#CCFF00" stroke-width="1.5" opacity="0.5"/>
    <text x="74" y="159" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Available for Work</text>
  </g>

  <!-- FLOATING BADGE 2: Bottom Right (Creative UI/UX) -->
  <g filter="url(#badgeShadow)">
    <rect x="330" y="380" width="180" height="54" rx="27" fill="#CCFF00"/>
    <!-- Icon circle -->
    <circle cx="360" cy="407" r="15" fill="#0E1013"/>
    <path d="M355 407 L365 407 M360 402 L360 412" stroke="#CCFF00" stroke-width="2" stroke-linecap="round"/>
    <text x="384" y="403" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0E1013">Creative Dev</text>
    <text x="384" y="419" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#2E3802">Web &amp; UI Specialist</text>
  </g>

  <!-- FLOATING BADGE 3: Bottom Left (Code Stack) -->
  <g filter="url(#badgeShadow)">
    <rect x="40" y="440" width="170" height="52" rx="26" fill="#1A1D24" stroke="#2D333F" stroke-width="1.5"/>
    <rect x="52" y="452" width="28" height="28" rx="14" fill="#262C38"/>
    <!-- Code brackets icon -->
    <path d="M63 461 L58 466 L63 471 M69 461 L74 466 L69 471" stroke="#CCFF00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Full-Stack</text>
    <text x="90" y="480" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#8C94A0">PHP • JS • Laravel</text>
  </g>

  <!-- Decorative Sparkle -->
  <path d="M475 220 Q485 220 485 210 Q485 220 495 220 Q485 220 485 230 Q485 220 475 220 Z" fill="#CCFF00"/>
  <path d="M65 330 Q72 330 72 323 Q72 330 79 330 Q72 330 72 337 Q72 330 65 330 Z" fill="#CCFF00" opacity="0.8"/>
</svg>
