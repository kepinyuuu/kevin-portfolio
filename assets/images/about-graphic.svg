<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutCardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191C22"/>
      <stop offset="100%" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CCFF00"/>
      <stop offset="100%" stop-color="#00FFA3"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="160" cy="120" r="140" fill="#CCFF00" opacity="0.08" filter="blur(40px)"/>
  <circle cx="400" cy="320" r="120" fill="#CCFF00" opacity="0.05" filter="blur(35px)"/>

  <!-- Main IDE Terminal Card -->
  <g filter="url(#softShadow)">
    <rect x="25" y="30" width="470" height="340" rx="24" fill="url(#aboutCardGradient)" stroke="#262932" stroke-width="1.5"/>

    <!-- Window Header -->
    <path d="M25 54 C25 40.7 35.7 30 49 30 L471 30 C484.3 30 495 40.7 495 54 L495 72 L25 72 Z" fill="#14161B"/>
    <!-- Window controls -->
    <circle cx="52" cy="51" r="5" fill="#FF5F56"/>
    <circle cx="70" cy="51" r="5" fill="#FFBD2E"/>
    <circle cx="88" cy="51" r="5" fill="#27C93F"/>

    <!-- Tab -->
    <rect x="120" y="39" width="130" height="25" rx="6" fill="#1F232B"/>
    <circle cx="134" cy="51" r="3.5" fill="#CCFF00"/>
    <text x="146" y="55" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0">kevin.config.ts</text>

    <!-- Code Editor Content -->
    <g font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5" line-height="1.6">
      <!-- Line 1 -->
      <text x="50" y="105" fill="#64748B">01</text>
      <text x="80" y="105" fill="#F472B6">const</text>
      <text x="125" y="105" fill="#CCFF00">developer</text>
      <text x="200" y="105" fill="#94A3B8">=</text>
      <text x="215" y="105" fill="#F8FAFC">{</text>

      <!-- Line 2 -->
      <text x="50" y="132" fill="#64748B">02</text>
      <text x="96" y="132" fill="#E2E8F0">name:</text>
      <text x="150" y="132" fill="#A5F3FC">'Kevin'</text>
      <text x="205" y="132" fill="#64748B">,</text>

      <!-- Line 3 -->
      <text x="50" y="159" fill="#64748B">03</text>
      <text x="96" y="159" fill="#E2E8F0">education:</text>
      <text x="180" y="159" fill="#FDE047">'SMK Negeri 1 Bangsri'</text>
      <text x="360" y="159" fill="#64748B">,</text>

      <!-- Line 4 -->
      <text x="50" y="186" fill="#64748B">04</text>
      <text x="96" y="186" fill="#E2E8F0">major:</text>
      <text x="150" y="186" fill="#A5F3FC">'PPLG (Software Dev)'</text>
      <text x="315" y="186" fill="#64748B">,</text>

      <!-- Line 5 -->
      <text x="50" y="213" fill="#64748B">05</text>
      <text x="96" y="213" fill="#E2E8F0">focus:</text>
      <text x="150" y="213" fill="#CCFF00">['Web Apps', 'Modern UI/UX', 'APIs']</text>
      <text x="430" y="213" fill="#64748B">,</text>

      <!-- Line 6 -->
      <text x="50" y="240" fill="#64748B">06</text>
      <text x="96" y="240" fill="#E2E8F0">mindset:</text>
      <text x="165" y="240" fill="#38BDF8">'Code cleanly, design thoughtfully'</text>

      <!-- Line 7 -->
      <text x="50" y="267" fill="#64748B">07</text>
      <text x="80" y="267" fill="#F8FAFC">};</text>
    </g>

    <!-- Bottom Status Line inside terminal -->
    <rect x="25" y="324" width="470" height="46" rx="0" fill="#14161A"/>
    <path d="M25 324 L495 324" stroke="#252932" stroke-width="1"/>
    <circle cx="50" cy="347" r="4" fill="#CCFF00"/>
    <text x="64" y="351" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">Ready for collaboration</text>

    <!-- Branch Pill -->
    <rect x="350" y="337" width="125" height="22" rx="11" fill="#1F232B"/>
    <text x="364" y="352" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10" font-weight="600" fill="#CCFF00">main • clean-build</text>
  </g>

  <!-- Floating Overlaid UI Mini-Card -->
  <g filter="url(#softShadow)">
    <rect x="260" y="280" width="230" height="125" rx="18" fill="#1D2028" stroke="#373C48" stroke-width="1.5"/>
    <text x="280" y="308" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Design System Kit</text>
    <rect x="425" y="296" width="48" height="18" rx="9" fill="#CCFF00"/>
    <text x="437" y="309" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#0E1013">ACTIVE</text>

    <!-- Swatches -->
    <circle cx="288" cy="336" r="10" fill="#CCFF00"/>
    <circle cx="316" cy="336" r="10" fill="#0E1013" stroke="#4B5563" stroke-width="1"/>
    <circle cx="344" cy="336" r="10" fill="#FFFFFF"/>
    <circle cx="372" cy="336" r="10" fill="#6366F1"/>

    <!-- Progress bar -->
    <rect x="280" y="365" width="190" height="6" rx="3" fill="#2E3340"/>
    <rect x="280" y="365" width="155" height="6" rx="3" fill="#CCFF00"/>
    <text x="280" y="388" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">Pixel-perfect component fidelity</text>
  </g>
</svg>
