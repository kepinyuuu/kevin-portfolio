<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="woodoraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181D"/>
      <stop offset="100%" stop-color="#0E1013"/>
    </linearGradient>
    <filter id="chairShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Browser Frame -->
  <rect x="10" y="10" width="660" height="400" rx="20" fill="url(#woodoraBg)" stroke="#262A34" stroke-width="2"/>

  <!-- Top bar -->
  <path d="M10 30 C10 19 19 10 30 10 L650 10 C661 10 670 19 670 30 L670 52 L10 52 Z" fill="#1C1F27"/>
  <circle cx="34" cy="31" r="5" fill="#EF4444"/>
  <circle cx="50" cy="31" r="5" fill="#F59E0B"/>
  <circle cx="66" cy="31" r="5" fill="#10B981"/>

  <!-- URL Bar -->
  <rect x="100" y="21" width="300" height="22" rx="6" fill="#111317"/>
  <text x="135" y="36" font-family="'Plus Jakarta Sans', monospace, sans-serif" font-size="10.5" fill="#94A3B8">https://woodora-furnish.com/living</text>

  <!-- Website Nav -->
  <text x="45" y="92" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="1">WOODORA.</text>
  <text x="195" y="91" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#CCFF00">Chairs</text>
  <text x="260" y="91" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Tables</text>
  <text x="325" y="91" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Lighting</text>
  <text x="390" y="91" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8">Art &amp; Decor</text>
  <!-- Cart badge -->
  <rect x="585" y="76" width="55" height="26" rx="13" fill="#242934"/>
  <text x="600" y="93" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#CCFF00">BAG (2)</text>

  <!-- Product Feature Grid (Card 1: Nordic Minimal Chair) -->
  <g filter="url(#chairShadow)">
    <rect x="40" y="120" width="360" height="265" rx="16" fill="#1A1C22" stroke="#2D313C" stroke-width="1.5"/>

    <!-- Subtle circle spotlight -->
    <ellipse cx="220" cy="245" rx="100" ry="30" fill="#000000" opacity="0.4"/>
    <circle cx="220" cy="210" r="85" fill="#252A36" opacity="0.5"/>

    <!-- Minimalist Chair Illustration -->
    <!-- Chair backrest -->
    <path d="M185 170 C185 145 255 145 255 170 L250 220 L190 220 Z" fill="#D4A373" rx="10"/>
    <path d="M195 175 C195 155 245 155 245 175 L242 215 L198 215 Z" fill="#C38D5C"/>
    <!-- Cushion / Seat -->
    <ellipse cx="220" cy="225" rx="55" ry="18" fill="#EAE0D5"/>
    <path d="M165 225 C165 235 275 235 275 225 Z" fill="#D3C5B5"/>
    <!-- Chair Legs -->
    <line x1="180" y1="230" x2="160" y2="295" stroke="#2C1810" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="260" y1="230" x2="280" y2="295" stroke="#2C1810" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="195" y1="232" x2="188" y2="285" stroke="#4A2810" stroke-width="3" stroke-linecap="round"/>
    <line x1="245" y1="232" x2="252" y2="285" stroke="#4A2810" stroke-width="3" stroke-linecap="round"/>

    <!-- Floating tag on chair -->
    <rect x="60" y="140" width="85" height="22" rx="11" fill="#CCFF00"/>
    <text x="73" y="155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#0E1013">BESTSELLER</text>

    <!-- Product Meta -->
    <text x="60" y="338" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Koto Lounge Armchair</text>
    <text x="60" y="358" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8">Solid White Oak • Oatmeal Fabric</text>
    <text x="325" y="348" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#CCFF00">$289</text>
  </g>

  <!-- Side Mini Card: Desk Lamp & Collections -->
  <g filter="url(#chairShadow)">
    <rect x="420" y="120" width="220" height="125" rx="16" fill="#1A1C22" stroke="#2D313C" stroke-width="1.5"/>
    <text x="440" y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Aura Minimal Lamp</text>
    <text x="440" y="170" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#94A3B8">Matte Black Brass</text>
    <text x="440" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="800" fill="#CCFF00">$124</text>
    <!-- Mini lamp art -->
    <path d="M570 215 L590 145 L605 145" stroke="#CCFF00" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="605" cy="150" rx="14" ry="7" fill="#CCFF00"/>
    <line x1="560" y1="215" x2="585" y2="215" stroke="#FFFFFF" stroke-width="3"/>
  </g>

  <g filter="url(#chairShadow)">
    <rect x="420" y="260" width="220" height="125" rx="16" fill="#20242D" stroke="#2D313C" stroke-width="1.5"/>
    <text x="440" y="295" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Summer Sale 2026</text>
    <text x="440" y="318" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" fill="#CCFF00">Up to 35% Off Selected Sets</text>
    <rect x="440" y="335" width="110" height="30" rx="15" fill="#CCFF00"/>
    <text x="456" y="354" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#0E1013">Explore Deals</text>
  </g>
</svg>
